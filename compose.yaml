services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:5081:5080"
    environment:
      ODYSSEUM_DEMO: "true"
      ODYSSEUM_PASSWORD: "${ODYSSEUM_PASSWORD:-}"
      ODYSSEUM_SCAN_SECONDS: "3"
    volumes:
      - ./projects:/projects
      - ./data:/data
  web:
    build:
      context: "${ODYSSEUM_WEB_PATH:-./odysseum-web}"
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:5080:3000"
    environment:
      NUXT_API_ORIGIN: "http://api:5080"
