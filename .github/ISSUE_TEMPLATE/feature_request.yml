name: Feature request
description: Suggest an idea for Odysseum.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the writing task or problem, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
    validations:
      required: true
  - type: textarea
    id: other
    attributes:
      label: Anything else?
      description: Other tools that do this well, sketches, or links.
