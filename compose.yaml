services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:5080:5080"
    environment:
      ODYSSEUM_DEMO: "true"
      ODYSSEUM_PASSWORD: "${ODYSSEUM_PASSWORD:-}"
      ODYSSEUM_SCAN_SECONDS: "3"
    volumes:
      - ./projects:/projects
      - ./data:/data
# The web UI lives in the /data volume. Install or update it without rebuilding the image:
#   docker compose run --rm api --update-webui latest
#   docker compose run --rm api --install-webui /data/odysseum-webui.zip
